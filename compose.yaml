services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: skillsync-backend
    restart: unless-stopped
    environment:
      - PORT=5001
      - MONGODB_URI=${MONGODB_URI:-mongodb://host.docker.internal:27017/skillsync}
      - JWT_SECRET=${JWT_SECRET:-skillsync_rbac_dev_secret_key_2026_secure}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5001:5001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5001/api/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - skillsync-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: skillsync-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - skillsync-network

networks:
  skillsync-network:
    driver: bridge
